<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Infinite Potential">
  <defs>
    <radialGradient id="field" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#0d2109"/>
      <stop offset="100%" stop-color="#030803"/>
    </radialGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c8ff8a"/>
      <stop offset="50%" stop-color="#8CFF3D"/>
      <stop offset="100%" stop-color="#5f9e2c"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" fill="url(#field)"/>

  <!-- layered strokes stand in for a blur so the mark rasterizes identically everywhere -->
  <g fill="none" stroke-linecap="round">
    <path d="M12,32 C12,19 26,19 32,32 C38,45 52,45 52,32 C52,19 38,19 32,32 C26,45 12,45 12,32 Z"
          stroke="#8CFF3D" stroke-opacity="0.10" stroke-width="17"/>
    <path d="M12,32 C12,19 26,19 32,32 C38,45 52,45 52,32 C52,19 38,19 32,32 C26,45 12,45 12,32 Z"
          stroke="#8CFF3D" stroke-opacity="0.18" stroke-width="11.5"/>
    <path d="M12,32 C12,19 26,19 32,32 C38,45 52,45 52,32 C52,19 38,19 32,32 C26,45 12,45 12,32 Z"
          stroke="url(#stroke)" stroke-width="5.8"/>
    <path d="M12,32 C12,19 26,19 32,32 C38,45 52,45 52,32 C52,19 38,19 32,32 C26,45 12,45 12,32 Z"
          stroke="#eaffcd" stroke-opacity="0.85" stroke-width="1.6"/>
  </g>
</svg>
